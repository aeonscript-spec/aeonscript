[package]
name = "aeonscript"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust reference implementation of the AeonScript open standard for DNA-based information archival"
license = "MIT"
repository = "https://github.com/aeonscript-spec/aeonscript"
homepage = "https://aeonscript.org"
documentation = "https://docs.rs/aeonscript"
readme = "README.md"
keywords = ["dna", "storage", "archival", "bioinformatics", "encoding"]
categories = ["compression", "encoding", "science"]
authors = ["The AeonScript Contributors"]

[dependencies]
# Reed-Solomon: byte-level RS(n, k) over GF(256), matching the Python ref
reed-solomon = "0.2"
# Ergonomic error types
thiserror = "1"
# JSON for biosafety hazard DB loading
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# nothing yet — integration tests use std only

[[example]]
name = "smoke_test"
path = "examples/smoke_test.rs"

[lib]
name = "aeonscript"
path = "src/lib.rs"

[[bin]]
name = "aeonscript"
path = "src/bin/aeonscript.rs"
