<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0b0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle helix decoration on the right -->
  <g transform="translate(900, 60)" stroke="#00d4a8" stroke-width="1.8" fill="none" opacity="0.35">
    <path d="M40 0 Q120 60 200 120 Q120 180 40 240 Q120 300 200 360 Q120 420 40 480"/>
    <path d="M200 0 Q120 60 40 120 Q120 180 200 240 Q120 300 40 360 Q120 420 200 480"/>
    <line x1="40" y1="0" x2="200" y2="0"/>
    <line x1="200" y1="60" x2="40" y2="60"/>
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="200" y1="180" x2="40" y2="180"/>
    <line x1="40" y1="240" x2="200" y2="240"/>
    <line x1="200" y1="300" x2="40" y2="300"/>
    <line x1="40" y1="360" x2="200" y2="360"/>
    <line x1="200" y1="420" x2="40" y2="420"/>
    <line x1="40" y1="480" x2="200" y2="480"/>
  </g>

  <!-- Soft glow behind title -->
  <circle cx="120" cy="380" r="280" fill="url(#glow)"/>

  <!-- Logo + brand -->
  <g transform="translate(80, 80)">
    <g stroke="#00d4a8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M0 0 Q14 14 28 0 M0 14 Q14 28 28 14 M0 28 Q14 42 28 28"/>
    </g>
    <text x="50" y="22" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e8e8ec">AeonScript</text>
  </g>

  <!-- Badge -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" rx="100" ry="100" width="260" height="32" fill="rgba(0,212,168,0.1)" stroke="rgba(0,212,168,0.3)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#00d4a8"/>
    <text x="32" y="22" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" fill="#00d4a8">v0.1 · early draft · open spec</text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="600" fill="url(#title)" letter-spacing="-2">An open standard</text>
  <text x="80" y="368" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="600" fill="url(#title)" letter-spacing="-2">for archiving</text>
  <text x="80" y="446" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="600" letter-spacing="-2">
    <tspan fill="url(#title)">humanity </tspan><tspan fill="#00d4a8">in DNA.</tspan>
  </text>

  <!-- Subtitle / URL -->
  <text x="80" y="540" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#8a8a96">Self-describing · layered · readable in 200 years.</text>
  <text x="80" y="580" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="18" fill="#00d4a8">aeonscript.org</text>
</svg>
