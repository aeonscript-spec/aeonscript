[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeonscript"
version = "0.1.0"
description = "Reference implementation of the AeonScript open standard for DNA-based information archival"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "The AeonScript Contributors" },
]
keywords = ["dna", "storage", "archival", "bioinformatics", "encoding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "reedsolo>=1.7.0",
]

[project.scripts]
aeonscript = "aeonscript.cli:main"

[project.optional-dependencies]
fast-hash = ["blake3>=0.4.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aeonscript*"]

[tool.setuptools.package-data]
aeonscript = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
